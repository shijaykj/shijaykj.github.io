<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0a0d12">
  <meta name="color-scheme" content="dark">
  <title>Page not found | Shijay Jayan</title>
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css?v=6">
  <style>
    .nf { min-height: 100svh; display: grid; place-items: center; text-align: center; padding: 40px 16px; position: relative; overflow: hidden; isolation: isolate; }
    .nf .hero-grid { opacity: .5; }
    .nf-code { font: 700 clamp(72px, 16vw, 160px)/1 var(--display); letter-spacing: -.05em; margin: 22px 0 8px;
      background: linear-gradient(100deg, var(--accent) 10%, #d4f5a8 50%, var(--accent-2) 95%); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .nf h1 { font: 700 clamp(24px, 4vw, 34px)/1.2 var(--display); letter-spacing: -.02em; margin: 0 0 10px; }
    .nf p { color: var(--muted); margin: 0 auto 32px; max-width: 460px; }
    .nf-log { display: inline-block; text-align: left; font: 13px/2 var(--mono); color: var(--muted); background: var(--surface); border: 1px solid var(--line-2); border-radius: 12px; padding: 14px 20px; margin-bottom: 32px; }
    .nf-log i { color: #ff8b8b; font-style: normal; }
    .nf-log b { color: var(--accent); font-weight: 500; }
  </style>
</head>
<body>
  <main class="nf">
    <div class="hero-grid" aria-hidden="true"></div>
    <div>
      <div class="eyebrow"><span class="dot"></span> HTTP 404</div>
      <div class="nf-code" aria-hidden="true">404</div>
      <h1>This request didn't meet its SLA.</h1>
      <p>The page you're looking for doesn't exist or has moved.</p>
      <div class="nf-log" aria-hidden="true"><i>✗</i> GET <span id="path">/</span> → 404 Not Found<br><b>→ Routing you back home</b></div>
      <div><a class="btn primary" href="/">Back to the portfolio <span class="btn-arrow" aria-hidden="true">↗</span></a></div>
    </div>
  </main>
  <script>document.getElementById('path').textContent = location.pathname;</script>
</body>
</html>
